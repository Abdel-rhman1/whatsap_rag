<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp RAG Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #25d366;
            --primary-dark: #128c7e;
            --bg: #0b141a;
            --card-bg: #111b21;
            --text-main: #e9edef;
            --text-muted: #8696a0;
            --accent: #00a884;
            --warning: #ffc107;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        .logo {
            width: 64px;
            height: 64px;
            background: var(--primary);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 12px 24px rgba(37, 211, 102, 0.4);
        }

        .logo svg {
            width: 36px;
            height: 36px;
            fill: white;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 32px;
        }

        .qr-wrapper {
            position: relative;
            width: 270px;
            height: 270px;
            margin: 0 auto 28px;
            background: #fff;
            padding: 16px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateZ(0);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #qr-image {
            width: 100%;
            height: 100%;
            display: none;
            image-rendering: pixelated;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }

        .status-initializing {
            background: rgba(255, 193, 7, 0.1);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.2);
        }

        .status-qr_ready {
            background: rgba(0, 168, 132, 0.1);
            color: var(--accent);
            border: 1px solid rgba(0, 168, 132, 0.2);
        }

        .status-authenticating,
        .status-linking {
            background: rgba(255, 193, 7, 0.2);
            color: #ffeb3b;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .status-connected {
            background: rgba(37, 211, 102, 0.1);
            color: var(--primary);
            border: 1px solid rgba(37, 211, 102, 0.2);
        }

        .status-failed {
            background: rgba(255, 59, 48, 0.1);
            color: #ff3b30;
            border: 1px solid rgba(255, 59, 48, 0.2);
        }

        .spinner {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(0, 0, 0, 0.05);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .connected-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: scaleCheck 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes scaleCheck {
            from {
                transform: scale(0);
            }

            to {
                transform: scale(1);
            }
        }

        .connected-view svg {
            width: 88px;
            height: 88px;
            fill: var(--primary);
            margin-bottom: 24px;
            filter: drop-shadow(0 8px 16px rgba(37, 211, 102, 0.3));
        }

        .connected-title {
            font-weight: 700;
            color: var(--primary);
            font-size: 22px;
            margin-bottom: 4px;
        }

        .connected-phone {
            font-size: 14px;
            color: var(--text-muted);
            font-family: monospace;
        }

        .instructions {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            min-height: 48px;
            max-width: 280px;
            margin: 0 auto;
        }

        .pulse {
            animation: pulseAnim 2s infinite;
        }

        @keyframes pulseAnim {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.01-.371-.012-.57-.012-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z" />
                </svg>
            </div>

            <span id="status-badge" class="status-pill status-initializing">Initializing</span>

            <h1>RAG Gateway</h1>
            <p class="subtitle" id="subtitle-text">Preparing your secure session...</p>

            <div class="qr-wrapper">
                <div id="loading-spinner" class="spinner"></div>
                <img id="qr-image" src="" alt="Scan this QR">
                <div id="connected-view" class="connected-view">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
                    </svg>
                    <div class="connected-title">Gateway Active</div>
                    <div class="connected-phone" id="linked-phone">Account Linked</div>
                </div>
            </div>

            <p id="msg-text" class="instructions">Connecting to WhatsApp server...</p>

            <div
                style="font-size: 10px; margin-top: 24px; color: var(--text-muted); font-family: monospace; letter-spacing: 0.5px;">
                SESSION ID: <span id="sess-id-val" style="color: var(--primary);">...</span>
            </div>
        </div>
    </div>

    <script>
        const sessionId = 'default'; // Injected via Express
        document.getElementById('sess-id-val').textContent = sessionId;

        async function updateDashboard() {
            try {
                const response = await fetch(`/status/${sessionId}`);
                const data = await response.json();

                const badge = document.getElementById('status-badge');
                const spinner = document.getElementById('loading-spinner');
                const qrImage = document.getElementById('qr-image');
                const connectedView = document.getElementById('connected-view');
                const msg = document.getElementById('msg-text');
                const subtitle = document.getElementById('subtitle-text');
                const qrWrapper = document.querySelector('.qr-wrapper');

                badge.textContent = data.status.replace('_', ' ');
                badge.className = `status-pill status-${data.status.toLowerCase()}`;

                if (data.status === 'CONNECTED') {
                    spinner.style.display = 'none';
                    qrImage.style.display = 'none';
                    connectedView.style.display = 'flex';
                    qrWrapper.style.background = 'transparent';
                    qrWrapper.style.boxShadow = 'none';
                    subtitle.textContent = 'Integration Ready';
                    msg.innerHTML = 'Gateway is now linked to WhatsApp.<br>System is listening for messages.';
                    document.getElementById('linked-phone').textContent = data.phone ? `Phone: +${data.phone}` : 'Account Linked';
                    return; // Done
                }

                if (data.status === 'QR_READY') {
                    spinner.style.display = 'none';
                    qrImage.style.display = 'block';
                    qrWrapper.style.background = '#fff';
                    qrImage.src = `/qr/${sessionId}?t=${Date.now()}`;
                    subtitle.textContent = 'Scan QR Code';
                    msg.innerHTML = 'Use WhatsApp on your phone to scan.<br>Go to Linked Devices > Link a Device';
                } else if (data.status === 'LINKING' || data.status === 'AUTHENTICATING') {
                    spinner.style.display = 'block';
                    qrImage.style.display = 'none';
                    qrWrapper.style.background = 'rgba(255,255,255,0.03)';
                    subtitle.textContent = data.status === 'LINKING' ? 'Linking...' : 'Authenticating...';
                    msg.innerHTML = '<span class="pulse">Almost there! Your phone is communicating with the gateway.</span>';
                } else {
                    spinner.style.display = 'block';
                    qrImage.style.display = 'none';
                    qrWrapper.style.background = 'rgba(255,255,255,0.03)';
                    subtitle.textContent = 'Waiting for QR...';
                    msg.innerHTML = 'Establishing secure handshake...';
                }

                setTimeout(updateDashboard, 2000);
            } catch (e) {
                console.error('Status fetch failed:', e);
                setTimeout(updateDashboard, 5000);
            }
        }

        updateDashboard();
    </script>
</body>

</html>
